<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Boiadeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script>
        // ============================================
        // CONFIGURAÇÃO DO SUPABASE
        // ============================================
        const SUPABASE_URL = 'https://yIaxdmzkmlabrcdtuzbn.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_YCGb5Bk3btIBPPuQ9cDYTA_7kke5XoL';

        console.log('🚀 App iniciando...');
        console.log('📡 Conectando ao Supabase:', SUPABASE_URL);

        // ============================================
        // DADOS GLOBAIS
        // ============================================
        let checklists = [];
        let motoristaAtual = null;
        let fotos = { gaiolaDentro: null, gaiolaFora: null, anomalia: null };

        // ============================================
        // FUNÇÕES DO SUPABASE (COM CORS)
        // ============================================
        async function carregarDados() {
            console.log('📥 Carregando dados...');
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/checklists?select=*&order=id.desc`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('📡 Status da resposta:', response.status);
                
                if (!response.ok) {
                    throw new Error(`Erro ${response.status}: ${response.statusText}`);
                }
                
                checklists = await response.json();
                console.log('✅ Dados carregados:', checklists.length, 'checklists');
            } catch (error) {
                console.error('❌ Erro ao carregar dados:', error.message);
                alert('❌ Erro ao carregar dados: ' + error.message);
            }
        }

        async function salvarChecklistBD(checklist) {
            console.log('📝 Enviando checklist...');
            console.log('📊 Dados:', {
                motorista: checklist.motorista,
                placa: checklist.placa,
                modelo: checklist.modelo,
                tem_anomalia: checklist.tem_anomalia,
                tamanho_foto_dentro: checklist.foto_gaiola_dentro ? (checklist.foto_gaiola_dentro.length / 1024).toFixed(2) + ' KB' : 'sem foto',
                tamanho_foto_fora: checklist.foto_gaiola_fora ? (checklist.foto_gaiola_fora.length / 1024).toFixed(2) + ' KB' : 'sem foto'
            });

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/checklists`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(checklist)
                });
                
                console.log('📡 Status da resposta:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Erro do Supabase:', errorText);
                    alert('❌ Erro ' + response.status + ': ' + errorText);
                    return null;
                }
                
                const data = await response.json();
                console.log('✅ Checklist salvo com sucesso!', data);
                return data[0];
            } catch (error) {
                console.error('❌ Erro na requisição:', error.message);
                alert('❌ Erro ao salvar: ' + error.message);
                return null;
            }
        }

        // ============================================
        // FUNÇÕES DE AUTENTICAÇÃO
        // ============================================
        function fazerLogin(nome, placa) {
            motoristaAtual = { nome: nome.trim(), placa: placa.trim().toUpperCase() };
            localStorage.setItem('@ChecklistBoiadeiro:motorista', JSON.stringify(motoristaAtual));
            console.log('✅ Login realizado:', motoristaAtual);
            return true;
        }

        function getMotoristaLogado() {
            if (motoristaAtual) return motoristaAtual;
            const saved = localStorage.getItem('@ChecklistBoiadeiro:motorista');
            if (saved) {
                motoristaAtual = JSON.parse(saved);
                return motoristaAtual;
            }
            return null;
        }

        function logout() {
            if (confirm('Deseja realmente sair?')) {
                localStorage.removeItem('@ChecklistBoiadeiro:motorista');
                motoristaAtual = null;
                showLogin();
            }
        }

        // ============================================
        // FUNÇÃO PARA CAPTURAR GPS
        // ============================================
        function capturarGPS() {
            return new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            resolve({
                                latitude: position.coords.latitude,
                                longitude: position.coords.longitude,
                                localizacao: `${position.coords.latitude.toFixed(6)}, ${position.coords.longitude.toFixed(6)}`
                            });
                        },
                        () => {
                            resolve({ latitude: null, longitude: null, localizacao: 'Não disponível' });
                        }
                    );
                } else {
                    resolve({ latitude: null, longitude: null, localizacao: 'GPS não disponível' });
                }
            });
        }

        // ============================================
        // FUNÇÃO PARA TIRAR FOTO
        // ============================================
        function tirarFoto(tipo) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.capture = 'environment';
            
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                console.log('📷 Arquivo selecionado:', file.name, (file.size / 1024).toFixed(2), 'KB');
                
                if (file.size > 5 * 1024 * 1024) {
                    alert('⚠️ Imagem muito grande! Máximo 5MB.');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxWidth = 300;
                        const maxHeight = 225;
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > height) {
                            if (width > maxWidth) {
                                height *= maxWidth / width;
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width *= maxHeight / height;
                                height = maxHeight;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const imagemBase64 = canvas.toDataURL('image/jpeg', 0.2);
                        fotos[tipo] = imagemBase64;
                        
                        console.log('📸 Foto comprimida:', (imagemBase64.length / 1024).toFixed(2), 'KB');
                        
                        const preview = document.getElementById(`preview_${tipo}`);
                        if (preview) {
                            preview.src = imagemBase64;
                            preview.classList.remove('hidden');
                        }
                        
                        const btn = document.getElementById(`btn_foto_${tipo}`);
                        if (btn) {
                            btn.textContent = '✅ Foto tirada!';
                            btn.className = 'w-full py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg text-sm transition';
                        }
                        
                        const status = document.getElementById(`status_${tipo}`);
                        if (status) {
                            status.textContent = '✅ Foto tirada!';
                            status.className = 'text-xs text-green-500 mt-1';
                        }
                        
                        verificarFotos();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        // ============================================
        // VERIFICAR FOTOS
        // ============================================
        function verificarFotos() {
            const btnSalvar = document.getElementById('btnSalvar');
            if (!btnSalvar) return;
            
            if (fotos.gaiolaDentro && fotos.gaiolaFora) {
                btnSalvar.disabled = false;
                btnSalvar.className = 'flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg transition';
                btnSalvar.textContent = '✅ Salvar Checklist';
            } else {
                btnSalvar.disabled = true;
                btnSalvar.className = 'flex-1 bg-gray-400 cursor-not-allowed text-white font-bold py-3 rounded-lg transition';
                btnSalvar.textContent = '📸 Tire as fotos obrigatórias';
            }
        }

        // ============================================
        // TELA DE LOGIN
        // ============================================
        function showLogin() {
            const motorista = getMotoristaLogado();
            if (motorista) {
                showDashboard();
                return;

            document.getElementById('root').innerHTML = `

                        </div>

                            <h1 class="text-4xl font-bold text-green-700 dark:text-green-400">
                                Checklist Boiadeiro
                            </h1>
                            <p class="text-gray-500 dark:text-gray-400 mt-2 text-sm">
                                Vistoria de Veículos e Embarque
                            </p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-4">

                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">👤 Nome do Motorista</label>
                                <input type="text" id="nomeMotorista" placeholder="Digite seu nome" class="w-full px-4 py-3 border rounded-lg dark:bg-gray-700 dark:text-white" required>
                            </div>
                            <div>

                                <input type="text" id="placaMotorista" placeholder="ABC-1234" class="w-full px-4 py-3 border rounded-lg dark:bg-gray-700 dark:text-white" required>
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white font-bold py-3 rounded-lg transition shadow-lg">
                                Entrar
                            </button>
                        </form>
                        <div class="mt-4 text-center text-xs text-gray-500 dark:text-gray-400">
                            <p>👨‍🌾 Digite seu nome e a placa do veículo</p>
                        </div>
                        <div class="mt-8 text-center text-xs text-gray-500">© 2026 Checklist Boiadeiro</div>
                    </div>
                </div>
            `;
        }

        function handleLogin(event) {
            event.preventDefault();
            const nome = document.getElementById('nomeMotorista').value.trim();
            const placa = document.getElementById('placaMotorista').value.trim().toUpperCase();
            
            if (!nome || !placa) {
                alert('❌ Preencha seu nome e a placa do veículo!');
                return;
            }

            fazerLogin(nome, placa);
            showDashboard();
        }

            document.getElementById('root').innerHTML = `
                <div class="min-h-screen bg-gray-50 dark:bg-gray-900 p-4 md:p-6">
                    <div class="flex flex-wrap justify-between items-center mb-6">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-800 dark:text-white">📋 Dashboard</h1>

                        </div>

                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">

                    <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow">
                        <h2 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">📋 Meus Checklists</h2>
                        ${meusChecklists.length === 0 ? `

        // ============================================
        // TELA DE NOVO CHECKLIST
        // ============================================

            const motorista = getMotoristaLogado();
            if (!motorista) { showLogin(); return; }

            fotos = { gaiolaDentro: null, gaiolaFora: null, anomalia: null };

            setTimeout(async () => {
                const posicao = await capturarGPS();
                document.getElementById('latitude').value = posicao.latitude || '';
                document.getElementById('longitude').value = posicao.longitude || '';
                document.getElementById('localizacaoTexto').textContent = posicao.localizacao || 'Localização não disponível';
            }, 500);

            document.getElementById('root').innerHTML = `

                    <div class="flex flex-wrap justify-between items-center mb-6">

                    </div>

                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 md:p-8 max-w-3xl mx-auto">
                        <form id="formChecklist" onsubmit="salvarChecklist(event)" class="space-y-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">🚛 Placa</label>
                                    <input type="text" id="placa" value="${motorista.placa}" class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:text-white bg-gray-100 dark:bg-gray-600" readonly>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">🚛 Modelo *</label>
                                    <select id="modelo" class="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:text-white" required>
                                        <option value="">Selecione...</option>
                                        <option value="Truck">Truck</option>
                                        <option value="Julieta">Julieta</option>
                                        <option value="Carreta 27">Carreta 27</option>
                                        <option value="Carreta 36">Carreta 36</option>
                                        <option value="Carreta 50">Carreta 50</option>
                                    </select>
                                </div>
                            </div>

                            <div class="border-t border-gray-200 dark:border-gray-700 pt-4">
                                <h3 class="text-md font-semibold text-gray-800 dark:text-white mb-3">📸 Fotos Obrigatórias *</h3>
                                <p class="text-sm text-red-500 mb-3">⚠️ Tire as duas fotos para habilitar o botão salvar!</p>

                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Gaiola - Dentro *</label>
                                        <button type="button" id="btn_foto_gaiolaDentro" onclick="tirarFoto('gaiolaDentro')" class="w-full py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm transition">
                                            📷 Tirar Foto

                                        <img id="preview_gaiolaDentro" class="hidden w-full h-24 object-cover rounded-lg mt-2 border">
                                        <p id="status_gaiolaDentro" class="text-xs text-red-500 mt-1">⚠️ Pendente</p>
                                    </div>
                                    <div>

        // ============================================
        // FUNÇÕES DO CHECKLIST
        // ============================================
        function mostrarAnomalia(show) {
            document.getElementById('campoAnomalia').classList.toggle('hidden', !show);
        }

        function limparFormulario() {
            document.getElementById('modelo').value = '';
            document.getElementById('descricaoAnomalia').value = '';
            document.querySelector('input[name="anomalia"][value="nao"]').checked = true;
            document.getElementById('campoAnomalia').classList.add('hidden');
            
            fotos = { gaiolaDentro: null, gaiolaFora: null, anomalia: null };
            ['gaiolaDentro', 'gaiolaFora', 'anomalia'].forEach(tipo => {
                const preview = document.getElementById(`preview_${tipo}`);
                if (preview) {
                    preview.src = '';
                    preview.classList.add('hidden');
                }
                const btn = document.getElementById(`btn_foto_${tipo}`);
                if (btn) {
                    btn.textContent = '📷 Tirar Foto';
                    btn.className = 'w-full py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm transition';
                }
                const status = document.getElementById(`status_${tipo}`);
                if (status) {
                    status.textContent = '⚠️ Pendente';
                    status.className = 'text-xs text-red-500 mt-1';
                }
            });
            verificarFotos();
        }

        async function salvarChecklist(event) {
            event.preventDefault();
            
            console.log('🚀 INICIANDO SALVAMENTO...');
            
            const motorista = getMotoristaLogado();
            if (!motorista) { showLogin(); return; }

            console.log('📸 Verificando fotos...');
            console.log('  - Gaiola Dentro:', fotos.gaiolaDentro ? '✅' : '❌');
            console.log('  - Gaiola Fora:', fotos.gaiolaFora ? '✅' : '❌');
            
            if (!fotos.gaiolaDentro) {
                alert('❌ Tire a foto da gaiola (DENTRO)!');
                return;
            }
            if (!fotos.gaiolaFora) {
                alert('❌ Tire a foto da gaiola (FORA)!');
                return;
            }

            const modelo = document.getElementById('modelo').value;
            console.log('🚛 Modelo:', modelo);
            
            if (!modelo) {
                alert('❌ Selecione o modelo do veículo!');
                return;
            }

            const temAnomalia = document.querySelector('input[name="anomalia"]:checked').value === 'sim';
            const descricaoAnomalia = document.getElementById('descricaoAnomalia').value || '';
            const latitude = document.getElementById('latitude').value || null;
            const longitude = document.getElementById('longitude').value || null;
            const localizacao = document.getElementById('localizacaoTexto').textContent || 'Não disponível';

            const checklist = {
                motorista: motorista.nome,
                placa: motorista.placa,
                modelo: modelo,
                foto_gaiola_dentro: fotos.gaiolaDentro,
                foto_gaiola_fora: fotos.gaiolaFora,
                foto_anomalia: fotos.anomalia || null,
                tem_anomalia: temAnomalia,
                descricao_anomalia: descricaoAnomalia || null,
                latitude: latitude,
                longitude: longitude,
                localizacao: localizacao,
                status: 'Concluído',
                criado_em: new Date().toISOString()
            };

            const resultado = await salvarChecklistBD(checklist);
            if (resultado) {
                checklists.unshift(resultado);
                alert('✅ Checklist salvo com sucesso!');
                showDashboard();
            }
        }

        // ============================================
        // TELA DE HISTÓRICO
        // ============================================
        function showHistorico() {
            const motorista = getMotoristaLogado();
            if (!motorista) { showLogin(); return; }

            const meusChecklists = checklists.filter(c => c.motorista === motorista.nome);

            document.getElementById('root').innerHTML = `
                <div class="min-h-screen bg-gray-50 dark:bg-gray-900 p-4 md:p-6">
                    <div class="flex flex-wrap justify-between items-center mb-6">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-800 dark:text-white">📊 Meu Histórico</h1>
                            <p class="text-gray-500 dark:text-gray-400">${meusChecklists.length} checklists realizados</p>
                        </div>
                        <div class="flex gap-2 mt-3 md:mt-0">
                            <button onclick="showDashboard()" class="px-4 py-2 bg-gray-500 text-white rounded-lg text-sm hover:bg-gray-600">← Voltar</button>
                            <button onclick="toggleDarkMode()" class="px-4 py-2 bg-gray-300 dark:bg-gray-700 rounded-lg text-sm">🌙</button>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-hidden">
                        ${meusChecklists.length === 0 ? `
                            <p class="text-center text-gray-500 dark:text-gray-400 py-8">Nenhum checklist encontrado.</p>
                        ` : `
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm">
                                    <thead class="bg-gray-50 dark:bg-gray-700">
                                        <tr>
                                            <th class="px-4 py-3 text-left">Data</th>
                                            <th class="px-4 py-3 text-left">Placa</th>
                                            <th class="px-4 py-3 text-left">Modelo</th>
                                            <th class="px-4 py-3 text-left">Anomalia</th>
                                            <th class="px-4 py-3 text-left">Status</th>
                                            <th class="px-4 py-3 text-left">Localização</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${meusChecklists.map(c => `
                                            <tr class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
                                                <td class="px-4 py-3">${new Date(c.criado_em).toLocaleDateString('pt-BR')}</td>
                                                <td class="px-4 py-3 font-medium">${c.placa}</td>
                                                <td class="px-4 py-3">${c.modelo}</td>
                                                <td class="px-4 py-3">${c.tem_anomalia ? '⚠️ Sim' : '✅ Não'}</td>
                                                <td class="px-4 py-3">
                                                    <span class="px-2 py-1 rounded-full text-xs font-medium ${c.status === 'Concluído' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">${c.status}</span>
                                                </td>
                                                <td class="px-4 py-3 text-xs truncate max-w-[100px]">${c.localizacao || '-'}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        // ============================================
        // FUNÇÕES GLOBAIS
        // ============================================
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        // ============================================
        // INICIAR
        // ============================================
        async function iniciarApp() {
            console.log('🔄 Iniciando app...');
            await carregarDados();
            console.log('✅ App pronto!');
            showLogin();
        }
        
        iniciarApp();
    </script>
</body>
</html>
