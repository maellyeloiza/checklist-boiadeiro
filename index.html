<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Boiadeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script>
        // ============================================
        // DADOS GLOBAIS
        // ============================================
        let checklists = [];
        let usuarioAtual = null;
        let fotos = { gaiolaDentro: null, gaiolaFora: null, anomalia: null };
        let proximoId = 1;

        // ============================================
        // FUNÇÕES DO LOCALSTORAGE
        // ============================================
        function carregarDados() {
            const saved = localStorage.getItem('@ChecklistBoiadeiro:checklists');
            if (saved) {
                checklists = JSON.parse(saved);
                if (checklists.length > 0) {
                    proximoId = Math.max(...checklists.map(c => c.id)) + 1;
                }
            } else {
                checklists = [
                    { id: 1, motorista: 'João Silva', placa: 'ABC-1234', modelo: 'Truck', transportadora: 'Transportadora Alpha', foto_gaiola_dentro: '', foto_gaiola_fora: '', tem_anomalia: false, descricao_anomalia: '', latitude: '-23.550520', longitude: '-46.633308', localizacao: 'São Paulo - SP', status: 'Concluído', criado_em: new Date().toISOString() },
                    { id: 2, motorista: 'Carlos Santos', placa: 'XYZ-5678', modelo: 'Carreta 36', transportadora: 'Transportadora Beta', foto_gaiola_dentro: '', foto_gaiola_fora: '', tem_anomalia: true, descricao_anomalia: 'Pneu dianteiro danificado', latitude: '-22.906847', longitude: '-47.061200', localizacao: 'Campinas - SP', status: 'Concluído', criado_em: new Date().toISOString() },
                    { id: 3, motorista: 'Pedro Oliveira', placa: 'DEF-9012', modelo: 'Julieta', transportadora: 'Transportadora Alpha', foto_gaiola_dentro: '', foto_gaiola_fora: '', tem_anomalia: false, descricao_anomalia: '', latitude: '-21.175000', longitude: '-47.810000', localizacao: 'Ribeirão Preto - SP', status: 'Pendente', criado_em: new Date().toISOString() }
                ];
                salvarDados();
            }
            if (checklists.length > 0) {
                proximoId = Math.max(...checklists.map(c => c.id)) + 1;
            }
        }

        function salvarDados() {
            localStorage.setItem('@ChecklistBoiadeiro:checklists', JSON.stringify(checklists));
        }

        function salvarChecklistLocal(checklist) {
            checklist.id = proximoId++;
            checklist.criado_em = new Date().toISOString();
            checklists.unshift(checklist);
            salvarDados();
            return checklist;
        }

        function excluirChecklistLocal(id) {
            if (!confirm('⚠️ Tem certeza que deseja excluir este checklist?')) {
                return false;
            }
            checklists = checklists.filter(c => c.id !== id);
            salvarDados();
            return true;
        }

        // ============================================
        // SALVAR FORMULÁRIO
        // ============================================
        function salvarFormulario() {
            const dados = {
                modelo: document.getElementById('modelo')?.value || '',
                descricaoAnomalia: document.getElementById('descricaoAnomalia')?.value || '',
                anomalia: document.querySelector('input[name="anomalia"]:checked')?.value || 'nao',
                fotos: fotos
            };
            localStorage.setItem('@ChecklistBoiadeiro:formulario', JSON.stringify(dados));
        }

        function recuperarFormulario() {
            const saved = localStorage.getItem('@ChecklistBoiadeiro:formulario');
            if (saved) {
                try {
                    const dados = JSON.parse(saved);
                    if (document.getElementById('modelo')) {
                        document.getElementById('modelo').value = dados.modelo || '';
                    }
                    if (document.getElementById('descricaoAnomalia')) {
                        document.getElementById('descricaoAnomalia').value = dados.descricaoAnomalia || '';
                    }
                    if (dados.anomalia) {
                        const radio = document.querySelector(`input[name="anomalia"][value="${dados.anomalia}"]`);
                        if (radio) radio.checked = true;
                        if (dados.anomalia === 'sim') {
                            document.getElementById('campoAnomalia')?.classList.remove('hidden');
                        } else {
                            document.getElementById('campoAnomalia')?.classList.add('hidden');
                        }
                    }
                    if (dados.fotos) {
                        fotos = dados.fotos;
                        ['gaiolaDentro', 'gaiolaFora', 'anomalia'].forEach(tipo => {
                            if (fotos[tipo]) {
                                const preview = document.getElementById(`preview_${tipo}`);
                                if (preview) {
                                    preview.src = fotos[tipo];
                                    preview.classList.remove('hidden');
                                }
                                const btn = document.getElementById(`btn_foto_${tipo}`);
                                if (btn) {
                                    btn.textContent = '✅ Foto tirada!';
                                    btn.className = 'w-full py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg text-sm transition';
                                }
                                const status = document.getElementById(`status_${tipo}`);
                                if (status) {
                                    status.textContent = '✅ Foto tirada!';
                                    status.className = 'text-xs text-green-500 mt-1';
                                }
                            }
                        });
                        verificarFotos();
                    }
                    localStorage.removeItem('@ChecklistBoiadeiro:formulario');
                } catch (e) {
                    console.error('Erro ao recuperar formulário:', e);
                }
            }
        }

        // ============================================
        // FUNÇÃO PARA VER FOTO
        // ============================================
        function verFoto(base64, titulo) {
            if (!base64 || base64 === '') {
                alert('⚠️ Nenhuma foto disponível!');
                return;
            }
            
            const win = window.open('', '_blank');
            win.document.write(`
                <html>
                <head>
                    <title>${titulo}</title>
                    <style>
                        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #1a1a2e; font-family: Arial, sans-serif; }
                        .container { text-align: center; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); max-width: 90%; }
                        h2 { color: #2d3748; margin-top: 0; font-size: 24px; }
                        img { max-width: 100%; max-height: 75vh; border-radius: 8px; border: 3px solid #e2e8f0; }
                        .info { margin-top: 15px; color: #718096; font-size: 14px; }
                        .buttons { margin-top: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
                        button { padding: 10px 30px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: all 0.3s; }
                        .btn-fechar { background: #e53e3e; color: white; }
                        .btn-fechar:hover { background: #c53030; }
                        .btn-download { background: #48bb78; color: white; }
                        .btn-download:hover { background: #38a169; }
                    </style>
                </head>
                <body>
                    <div class="container">
                        <h2>📸 ${titulo}</h2>
                        <img src="${base64}" alt="${titulo}" id="foto" />
                        <div class="info">Clique com o botão direito para salvar a imagem</div>
                        <div class="buttons">
                            <button class="btn-download" onclick="baixarFoto()">⬇️ Baixar Foto</button>
                            <button class="btn-fechar" onclick="window.close()">✕ Fechar</button>
                        </div>
                    </div>
                    <script>
                        function baixarFoto() {
                            const link = document.createElement('a');
                            link.download = '${titulo.replace(/[^a-zA-Z0-9]/g, '_')}.jpg';
                            link.href = document.getElementById('foto').src;
                            link.click();
                        }
                    <\/script>
                </body>
                </html>
            `);
            win.document.close();
        }

        // ============================================
        // FUNÇÃO PARA TIRAR FOTO
        // ============================================
        function tirarFoto(tipo) {
            salvarFormulario();
            
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.capture = 'environment';
            
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxWidth = 800;
                        const maxHeight = 600;
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > height) {
                            if (width > maxWidth) {
                                height *= maxWidth / width;
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width *= maxHeight / height;
                                height = maxHeight;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const imagemBase64 = canvas.toDataURL('image/jpeg', 0.8);
                        fotos[tipo] = imagemBase64;
                        
                        const preview = document.getElementById(`preview_${tipo}`);
                        if (preview) {
                            preview.src = imagemBase64;
                            preview.classList.remove('hidden');
                        }
                        
                        const btn = document.getElementById(`btn_foto_${tipo}`);
                        if (btn) {
                            btn.textContent = '✅ Foto tirada!';
                            btn.className = 'w-full py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg text-sm transition';
                        }
                        
                        const status = document.getElementById(`status_${tipo}`);
                        if (status) {
                            status.textContent = '✅ Foto tirada!';
                            status.className = 'text-xs text-green-500 mt-1';
                        }
                        
                        verificarFotos();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        // ============================================
        // VERIFICAR FOTOS
        // ============================================
        function verificarFotos() {
            const btnSalvar = document.getElementById('btnSalvar');
            if (!btnSalvar) return;
            
            if (fotos.gaiolaDentro && fotos.gaiolaFora) {
                btnSalvar.disabled = false;
                btnSalvar.className = 'flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg transition';
                btnSalvar.textContent = '✅ Salvar Checklist';
            } else {
                btnSalvar.disabled = true;
                btnSalvar.className = 'flex-1 bg-gray-400 cursor-not-allowed text-white font-bold py-3 rounded-lg transition';
                btnSalvar.textContent = '📸 Tire as fotos obrigatórias';
            }
        }

        // ============================================
        // FUNÇÃO PARA CAPTURAR GPS
        // ============================================
        function capturarGPS() {
            return new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            resolve({
                                latitude: position.coords.latitude,
                                longitude: position.coords.longitude,
                                localizacao: `${position.coords.latitude.toFixed(6)}, ${position.coords.longitude.toFixed(6)}`
                            });
                        },
                        () => {
                            resolve({ latitude: null, longitude: null, localizacao: 'Não disponível' });
                        }
                    );
                } else {
                    resolve({ latitude: null, longitude: null, localizacao: 'GPS não disponível' });
                }
            });
        }

        // ============================================
        // EXPORTAÇÃO DE RELATÓRIOS (APENAS ADMIN)
        // ============================================
        function exportarExcel() {
            const usuario = getUsuarioLogado();
            if (!usuario || usuario.tipo !== 'admin') {
                alert('❌ Apenas administradores podem exportar relatórios!');
                return;
            }

            if (checklists.length === 0) {
                alert('❌ Não há dados para exportar!');
                return;
            }

            // Cabeçalho
            let csv = 'Data,Motorista,Placa,Modelo,Transportadora,Anomalia,Descrição,Localização,Status\n';
            
            // Dados
            checklists.forEach(c => {
                csv += `${new Date(c.criado_em).toLocaleDateString('pt-BR')},`;
                csv += `${c.motorista},`;
                csv += `${c.placa},`;
                csv += `${c.modelo},`;
                csv += `${c.transportadora || 'N/A'},`;
                csv += `${c.tem_anomalia ? 'Sim' : 'Não'},`;
                csv += `"${c.descricao_anomalia || ''}",`;
                csv += `${c.localizacao || 'N/A'},`;
                csv += `${c.status}\n`;
            });

            // Baixar
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `relatorio_checklists_${new Date().toLocaleDateString('pt-BR').replace(/\//g, '-')}.csv`;
            link.click();
            alert('✅ Relatório Excel exportado com sucesso!');
        }

        function exportarPDF() {
            const usuario = getUsuarioLogado();
            if (!usuario || usuario.tipo !== 'admin') {
                alert('❌ Apenas administradores podem exportar relatórios!');
                return;
            }

            if (checklists.length === 0) {
                alert('❌ Não há dados para exportar!');
                return;
            }

            // Criar conteúdo HTML para PDF
            const conteudo = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>Relatório Checklists</title>
                    <style>
                        body { font-family: Arial, sans-serif; margin: 40px; color: #333; }
                        h1 { color: #2d3748; text-align: center; border-bottom: 3px solid #4CAF50; padding-bottom: 20px; }
                        .resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }

                        .card .numero { font-size: 24px; font-weight: bold; color: #2d3748; }
                        .card .label { font-size: 12px; color: #6b7280; }
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                        th { background: #4CAF50; color: white; padding: 10px; text-align: left; }
                        td { padding: 8px 10px; border-bottom: 1px solid #e9ecef; }
                        tr:nth-child(even) { background: #f8f9fa; }
                        .footer { text-align: center; color: #999; font-size: 12px; margin-top: 40px; border-top: 1px solid #e9ecef; padding-top: 20px; }
                        .anomalia-sim { color: #dc3545; font-weight: bold; }
                        .anomalia-nao { color: #28a745; }

                    </style>
                </head>
                <body>
                    <h1>🐂 Checklist Boiadeiro - Relatório</h1>
                    <p style="text-align: center; color: #6b7280;">Gerado em: ${new Date().toLocaleString('pt-BR')}</p>

                    <div class="resumo">
                        <div class="card">
                            <div class="numero">${checklists.length}</div>
                            <div class="label">📋 Total</div>
                        </div>
                        <div class="card">
                            <div class="numero">${checklists.filter(c => c.status === 'Concluído').length}</div>
                            <div class="label">✅ Concluídos</div>
                        </div>
                        <div class="card">
                            <div class="numero">${checklists.filter(c => c.status === 'Pendente').length}</div>
                            <div class="label">⏳ Pendentes</div>
                        </div>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Motorista</th>
                                <th>Placa</th>
                                <th>Modelo</th>
                                <th>Transportadora</th>
                                <th>Anomalia</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${checklists.map(c => `
                                <tr>
                                    <td>${new Date(c.criado_em).toLocaleDateString('pt-BR')}</td>
                                    <td>${c.motorista}</td>
                                    <td>${c.placa}</td>
                                    <td>${c.modelo}</td>
                                    <td>${c.transportadora || 'N/A'}</td>
                                    <td class="${c.tem_anomalia ? 'anomalia-sim' : 'anomalia-nao'}">${c.tem_anomalia ? '⚠️ Sim' : '✅ Não'}</td>

            // Abrir em nova janela
            const win = window.open('', '_blank', 'width=1000,height=800');
            win.document.write(conteudo);
            win.document.close();
            
            setTimeout(() => {
                win.print();
            }, 500);
        }

        // ============================================
        // TELA DE LOGIN
        // ============================================
        function showLogin() {
            const usuario = getUsuarioLogado();
            if (usuario) {
                if (usuario.tipo === 'admin') {
                    showDashboardAdmin();
                } else {
                    showDashboardMotorista();
                }
                return;
            }

            document.getElementById('root').innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-green-50 to-emerald-100 dark:from-gray-900 dark:to-gray-800 flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md p-8">
                        <div class="flex justify-end">
                            <button onclick="toggleDarkMode()" class="text-2xl">🌙</button>
                        </div>
                        <div class="text-center mb-8">
                            <div class="text-6xl mb-3">🐂</div>
                            <h1 class="text-4xl font-bold text-green-700 dark:text-green-400">
                                Checklist Boiadeiro
                            </h1>
                            <p class="text-gray-500 dark:text-gray-400 mt-2 text-sm">
                                Vistoria de Veículos e Embarque
                            </p>
                        </div>

                        <div class="flex gap-3 mb-6">
                            <button onclick="showLoginAdmin()" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition font-bold">
                                👑 Admin
                            </button>
                            <button onclick="showLoginMotorista()" class="flex-1 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg transition font-bold">
                                🚛 Motorista
                            </button>
                        </div>

                        <div id="areaLogin" class="mt-4">
                            <p class="text-center text-gray-500 dark:text-gray-400 text-sm">
                                Selecione uma opção acima para continuar
                            </p>
                        </div>

                        <div class="mt-8 text-center text-xs text-gray-500">© 2026 Checklist Boiadeiro</div>
                    </div>
                </div>
            `;
        }

        // ============================================
        // LOGIN ADMIN
        // ============================================
        function showLoginAdmin() {
            document.getElementById('areaLogin').innerHTML = `
                <form onsubmit="handleLoginAdmin(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">👤 Nome do Administrador</label>
                        <input type="text" id="adminNome" placeholder="Digite seu nome" class="w-full px-4 py-3 border rounded-lg dark:bg-gray-700 dark:text-white" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">🔒 Senha</label>
                        <input type="password" id="adminSenha" placeholder="••••••••" class="w-full px-4 py-3 border rounded-lg dark:bg-gray-700 dark:text-white" required>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
                        Entrar como Admin
                    </button>
                    <button type="button" onclick="showLogin()" class="w-full text-sm text-gray-500 hover:text-gray-700 dark:text-gray-400">
                        ← Voltar
                    </button>
                </form>
            `;
        }

        function handleLoginAdmin(event) {
            event.preventDefault();
            const nome = document.getElementById('adminNome').value.trim();
            const senha = document.getElementById('adminSenha').value.trim();

            if (nome === 'Admin' && senha === 'admin123') {
                usuarioAtual = { nome: 'Admin', tipo: 'admin' };
                localStorage.setItem('@ChecklistBoiadeiro:usuario', JSON.stringify(usuarioAtual));
                showDashboardAdmin();
            } else {
                alert('❌ Nome ou senha incorretos!\n\n👑 Admin padrão: Admin / admin123');
            }
        }

        // ============================================
        // LOGIN MOTORISTA
        // ============================================
        function showLoginMotorista() {
            document.getElementById('areaLogin').innerHTML = `
                <form onsubmit="handleLoginMotorista(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">🏢 Transportadora</label>
                        <input type="text" id="transportadora" placeholder="Nome da transportadora" class="w-full px-4 py-3 border rounded-lg dark:bg-gray-700 dark:text-white" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">👤 Nome do Motorista</label>
                        <input type="text" id="motoristaNome" placeholder="Digite seu nome" class="w-full px-4 py-3 border rounded-lg dark:bg-gray-700 dark:text-white" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">🚛 Placa do Veículo</label>
                        <input type="text" id="motoristaPlaca" placeholder="ABC-1234" class="w-full px-4 py-3 border rounded-lg dark:bg-gray-700 dark:text-white" required>
                    </div>
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition">
                        Entrar como Motorista
                    </button>
                    <button type="button" onclick="showLogin()" class="w-full text-sm text-gray-500 hover:text-gray-700 dark:text-gray-400">
                        ← Voltar
                    </button>
                </form>
            `;
        }

        function handleLoginMotorista(event) {
            event.preventDefault();
            const transportadora = document.getElementById('transportadora').value.trim();
            const nome = document.getElementById('motoristaNome').value.trim();
            const placa = document.getElementById('motoristaPlaca').value.trim().toUpperCase();

            if (!transportadora || !nome || !placa) {
                alert('❌ Preencha todos os campos!');
                return;
            }

            usuarioAtual = {
                tipo: 'motorista',
                transportadora: transportadora,
                nome: nome,
                placa: placa
            };
            localStorage.setItem('@ChecklistBoiadeiro:usuario', JSON.stringify(usuarioAtual));
            showDashboardMotorista();
        }

        // ============================================
        // FUNÇÕES DE USUÁRIO
        // ============================================
        function getUsuarioLogado() {
            if (usuarioAtual) return usuarioAtual;
            const saved = localStorage.getItem('@ChecklistBoiadeiro:usuario');
            if (saved) {
                usuarioAtual = JSON.parse(saved);
                return usuarioAtual;
            }
            return null;
        }

        function logout() {
            if (confirm('Deseja realmente sair?')) {
                localStorage.removeItem('@ChecklistBoiadeiro:usuario');
                usuarioAtual = null;
                showLogin();
            }
        }

        // ============================================
        // EXCLUIR CHECKLIST
        // ============================================
        function excluirChecklist(id) {
            const usuario = getUsuarioLogado();
            if (!usuario || usuario.tipo !== 'admin') {
                alert('❌ Apenas administradores podem excluir!');
                return;
            }
            if (excluirChecklistLocal(id)) {
                alert('🗑️ Checklist excluído com sucesso!');

        function limparFormulario() {
            document.getElementById('modelo').value = '';
            document.getElementById('descricaoAnomalia').value = '';
            document.querySelector('input[name="anomalia"][value="nao"]').checked = true;
            document.getElementById('campoAnomalia').classList.add('hidden');
            
            fotos = { gaiolaDentro: null, gaiolaFora: null, anomalia: null };
            ['gaiolaDentro', 'gaiolaFora', 'anomalia'].forEach(tipo => {
                const preview = document.getElementById(`preview_${tipo}`);
                if (preview) {
                    preview.src = '';
                    preview.classList.add('hidden');
                }
                const btn = document.getElementById(`btn_foto_${tipo}`);
                if (btn) {
                    btn.textContent = '📷 Tirar Foto';
                    btn.className = 'w-full py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm transition';
                }
                const status = document.getElementById(`status_${tipo}`);
                if (status) {
                    status.textContent = '⚠️ Pendente';
                    status.className = 'text-xs text-red-500 mt-1';
                }
            });
            verificarFotos();
            localStorage.removeItem('@ChecklistBoiadeiro:formulario');
        }

        async function salvarChecklist(event) {
            event.preventDefault();
            
            const usuario = getUsuarioLogado();
            if (!usuario) { showLogin(); return; }

            if (!fotos.gaiolaDentro) {
                alert('❌ Tire a foto da gaiola (DENTRO)!');
                return;
            }
            if (!fotos.gaiolaFora) {
                alert('❌ Tire a foto da gaiola (FORA)!');
                return;
            }

            const transportadora = document.getElementById('transportadora').value.trim();
            const motorista = document.getElementById('motorista').value.trim();
            const placa = document.getElementById('placa').value.trim().toUpperCase();
            const modelo = document.getElementById('modelo').value;

            if (!modelo) {
                alert('❌ Selecione o modelo do veículo!');
                return;
            }

            const temAnomalia = document.querySelector('input[name="anomalia"]:checked').value === 'sim';
            const descricaoAnomalia = document.getElementById('descricaoAnomalia').value || '';
            const latitude = document.getElementById('latitude').value || null;
            const longitude = document.getElementById('longitude').value || null;
            const localizacao = document.getElementById('localizacaoTexto').textContent || 'Não disponível';

            const checklist = {
                motorista: motorista,
                placa: placa,
                modelo: modelo,
                transportadora: transportadora,
                foto_gaiola_dentro: fotos.gaiolaDentro,
                foto_gaiola_fora: fotos.gaiolaFora,
                foto_anomalia: fotos.anomalia || null,
                tem_anomalia: temAnomalia,
                descricao_anomalia: descricaoAnomalia || null,
                latitude: latitude,
                longitude: longitude,
                localizacao: localizacao,
                status: 'Concluído',
                criado_em: new Date().toISOString()
            };

            const resultado = salvarChecklistLocal(checklist);
            if (resultado) {
                localStorage.removeItem('@ChecklistBoiadeiro:formulario');
                alert('✅ Checklist salvo com sucesso!');
                if (usuario.tipo === 'admin') {
                    showDashboardAdmin();
                } else {
                    showDashboardMotorista();
                }
            }
        }

                                            <td class="px-4 py-3">
                                                <button onclick="verFoto('${c.foto_gaiola_dentro || ''}', 'Gaiola Dentro - ${c.placa}')" class="px-2 py-1 bg-blue-500 text-white rounded text-xs hover:bg-blue-600 mr-1">📷 Dentro</button>
                                                <button onclick="verFoto('${c.foto_gaiola_fora || ''}', 'Gaiola Fora - ${c.placa}')" class="px-2 py-1 bg-green-500 text-white rounded text-xs hover:bg-green-600">📷 Fora</button>
                                                ${c.foto_anomalia ? `<button onclick="verFoto('${c.foto_anomalia}', 'Anomalia - ${c.placa}')" class="px-2 py-1 bg-red-500 text-white rounded text-xs hover:bg-red-600 ml-1">⚠️</button>` : ''}
                                            </td>
                                            <td class="px-4 py-3">
                                                <button onclick="excluirChecklist(${c.id})" class="px-2 py-1 bg-red-600 text-white rounded text-xs hover:bg-red-700">
                                                    🗑️ Excluir
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        `}
                    </div>
                </div>
            `;
        }

        // ============================================
        // HISTÓRICO MOTORISTA (SEM EXCLUIR E SEM RELATÓRIOS)
        // ============================================
        function showHistoricoMotorista() {
            const usuario = getUsuarioLogado();
            if (!usuario || usuario.tipo !== 'motorista') { showLogin(); return; }

            const meusChecklists = checklists.filter(c => c.motorista === usuario.nome && c.placa === usuario.placa);

            document.getElementById('root').innerHTML = `
                <div class="min-h-screen bg-gray-50 dark:bg-gray-900 p-4 md:p-6">
                    <div class="flex flex-wrap justify-between items-center mb-6">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-800 dark:text-white">📊 Meu Histórico</h1>
                            <p class="text-gray-500 dark:text-gray-400">${meusChecklists.length} checklists realizados</p>
                        </div>
                        <div class="flex gap-2 mt-3 md:mt-0">
                            <button onclick="showDashboardMotorista()" class="px-4 py-2 bg-gray-500 text-white rounded-lg text-sm hover:bg-gray-600">← Voltar</button>
                            <button onclick="toggleDarkMode()" class="px-4 py-2 bg-gray-300 dark:bg-gray-700 rounded-lg text-sm">🌙</button>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg overflow-x-auto">
                        ${meusChecklists.length === 0 ? `
                            <p class="text-center text-gray-500 dark:text-gray-400 py-8">Nenhum checklist encontrado.</p>
                        ` : `
                            <table class="w-full text-sm">
                                <thead class="bg-gray-50 dark:bg-gray-700">
                                    <tr>
                                        <th class="px-4 py-3 text-left">Data</th>
                                        <th class="px-4 py-3 text-left">Placa</th>
                                        <th class="px-4 py-3 text-left">Modelo</th>
                                        <th class="px-4 py-3 text-left">Anomalia</th>
                                        <th class="px-4 py-3 text-left">Status</th>
                                        <th class="px-4 py-3 text-left">Fotos</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${meusChecklists.map(c => `
                                        <tr class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
                                            <td class="px-4 py-3">${new Date(c.criado_em).toLocaleDateString('pt-BR')}</td>
                                            <td class="px-4 py-3 font-medium">${c.placa}</td>
                                            <td class="px-4 py-3">${c.modelo}</td>
                                            <td class="px-4 py-3">${c.tem_anomalia ? '⚠️ Sim' : '✅ Não'}</td>
                                            <td class="px-4 py-3">
                                                <span class="px-2 py-1 rounded-full text-xs font-medium ${c.status === 'Concluído' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">${c.status}</span>
                                            </td>
                                            <td class="px-4 py-3">
                                                <button onclick="verFoto('${c.foto_gaiola_dentro || ''}', 'Gaiola Dentro - ${c.placa}')" class="px-2 py-1 bg-blue-500 text-white rounded text-xs hover:bg-blue-600 mr-1">📷 Dentro</button>
                                                <button onclick="verFoto('${c.foto_gaiola_fora || ''}', 'Gaiola Fora - ${c.placa}')" class="px-2 py-1 bg-green-500 text-white rounded text-xs hover:bg-green-600">📷 Fora</button>
                                                ${c.foto_anomalia ? `<button onclick="verFoto('${c.foto_anomalia}', 'Anomalia - ${c.placa}')" class="px-2 py-1 bg-red-500 text-white rounded text-xs hover:bg-red-600 ml-1">⚠️</button>` : ''}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        `}
                    </div>
                </div>
            `;
        }

        // ============================================
        // FUNÇÕES GLOBAIS
        // ============================================
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        // ============================================
        // INICIAR
        // ============================================
        carregarDados();
        showLogin();
    </script>
</body>
</html>
